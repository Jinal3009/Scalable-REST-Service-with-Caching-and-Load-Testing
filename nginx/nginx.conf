events { worker_connections 4096; }
http {
  upstream api {
    least_conn;
    server api:3000;   # Docker DNS returns every replica
    keepalive 64;
  }
  server {
    listen 80;
    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
